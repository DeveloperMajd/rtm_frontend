# Dependabot proposes npm updates once a week, a week's minor and patch
# releases in one pull request. Major versions aren't proposed: they're
# upgraded by hand, with whatever has to move with them (its first run
# proposed TypeScript 7 and @eslint/js 10, neither of which could install on
# its own). Security fixes still come whatever version they need (Dependabot
# applies update-types ignores to version updates only). A release is
# proposed only once it's a week old: time for a broken or hijacked one to be
# caught and withdrawn first. Nothing merges by itself, and a push to main
# deploys.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
